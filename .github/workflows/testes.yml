name: testes

# Roda a suite nos dois sistemas em que o programa e distribuido. O Windows entra
# aqui porque metade do que pode dar errado neste projeto e especifico dele:
# caminho com barra invertida, '%' em caminho de INI, e o remendo do console em
# gc3d_app.py.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  suite:
    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Linux
            runner: ubuntu-latest
          - nome: Windows
            runner: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # O conversor nao tem dependencia nenhuma; o tkinterdnd2 entra so para os
      # testes do arrastar e soltar nao serem pulados.
      - name: Instalar dependencias de teste
        run: python -m pip install --quiet pytest "tkinterdnd2==0.6.2"

      # Sem isto os testes que abrem janela seriam pulados no Linux, e justamente
      # eles cobrem a gravacao das preferencias. O runner do Windows ja tem sessao
      # grafica, entao la nao e preciso.
      - name: Tela virtual (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb python3-tk

      - name: Rodar a suite
        shell: bash
        run: |
          ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}python -m pytest tests -q -rf 2>&1 | tee pytest.txt

      # Sem isto, saber POR QUE a suite falhou exige baixar o log, que a API do
      # GitHub só entrega autenticado. Uma anotação aparece no próprio commit e é
      # legível por qualquer um, o que torna a falha diagnosticável de fora.
      - name: Publicar a falha como anotacao
        if: failure()
        shell: bash
        run: |
          python - <<'FIM'
          import pathlib

          arquivo = pathlib.Path("pytest.txt")
          if not arquivo.is_file():
              print("::error title=Suite falhou::a saida do pytest nao foi gravada")
              raise SystemExit

          linhas = [l for l in arquivo.read_text(
              encoding="utf-8", errors="replace").splitlines() if l.strip()]
          trecho = "\n".join(linhas[-45:])

          # Anotação é uma linha só: o '%' vem primeiro para não escapar duas
          # vezes, e a quebra de linha vira %0A.
          escapado = (
              trecho.replace("%", "%25")
              .replace("\r", "")
              .replace("\n", "%0A")
          )
          print(f"::error title=Suite falhou::{escapado}")
          FIM

      # Confere o programa pelo codigo-fonte, antes de qualquer empacotamento: se
      # falhar aqui, o problema e do codigo, nao do PyInstaller.
      - name: Conferir a linha de comando
        run: |
          python gc3d_app.py --version
          python gc3d_app.py config
